<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AeroLearn</title>

  <!-- Официальный скрипт Telegram Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0A0A0A;
      --card: #161616;
      --border: #2A2A2A;
      --text: #FFFFFF;
      --muted: #A3A3A3;
      --accent: #FFB547;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .box { width: 100%; max-width: 360px; text-align: center; }
    h1 { margin: 16px 0 4px; font-size: 32px; letter-spacing: -1px; }
    h1 span { color: var(--accent); }
    .sub { margin: 0 0 24px; font-size: 13px; letter-spacing: 3px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
    }
    .card b { color: var(--accent); }
    button {
      width: 100%;
      height: 52px;
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #1A1200;
      font: 700 16px -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="box">
    <svg width="96" height="96" viewBox="0 0 120 120" fill="none" role="img" aria-label="Логотип AeroLearn">
      <circle cx="60" cy="60" r="52" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M60 8v9M60 103v9M8 60h9M103 60h9" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 26L84 86L60 74L36 86Z" fill="#FFB547" stroke="#FFB547" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <h1>Aero<span>Learn</span></h1>
    <p class="sub">ОБУЧЕНИЕ ПИЛОТОВ</p>

    <div class="card" id="info">Загрузка…</div>
    <button id="btn" type="button">Проверить связь с Telegram</button>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const info = document.getElementById("info");
    const btn = document.getElementById("btn");

    if (tg && tg.initData) {
      // Сообщаем Telegram, что приложение готово, и раскрываем на весь экран
      tg.ready();
      tg.expand();

      // Фон шапки под цвет приложения
      tg.setHeaderColor("#0A0A0A");
      tg.setBackgroundColor("#0A0A0A");

      // ВНИМАНИЕ: initDataUnsafe можно использовать только для показа имени.
      // Для авторизации initData нужно проверять на сервере по токену бота.
      const user = tg.initDataUnsafe.user || {};
      info.innerHTML =
        "<b>Приложение запущено в Telegram.</b><br>" +
        "Пользователь: " + (user.first_name || "неизвестно") + "<br>" +
        "Язык: " + (user.language_code || "—") + "<br>" +
        "Платформа: " + tg.platform + "<br>" +
        "Тема: " + tg.colorScheme;

      btn.addEventListener("click", function () {
        tg.HapticFeedback.notificationOccurred("success");
        tg.showAlert("Связь с Telegram работает!");
      });
    } else {
      info.innerHTML =
        "<b>Страница открыта вне Telegram.</b><br>" +
        "Откройте приложение через бота: " +
        "<a href=\"https://t.me/AeroLearning_bot\" style=\"color:#FFB547\">@AeroLearning_bot</a>";
      btn.style.display = "none";
    }
  </script>
</body>
</html>
