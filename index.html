<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AeroLearn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0A0A0A;--card:#161616;--bd:#2A2A2A;--bd2:#3D3D3D;--tx:#FFFFFF;--mu:#A3A3A3;--ac:#FFB547;--ok:#4ADE80;--bad:#FF7A7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;color:var(--tx);transition:transform .12s ease,background-color .2s,border-color .2s,color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
#app{max-width:480px;min-height:100vh;margin:0 auto}
#view{padding:24px 16px 104px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.m{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap;gap:8px}
.ch{padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-weight:500;font-size:13px;cursor:pointer}
.ch.on{background:var(--ac);color:#1A1200;border-color:var(--ac)}
.in{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:0 14px;height:52px}
.in input,.fi{background:none;border:0;outline:0;color:var(--tx);font-weight:500;font-size:15px;font-family:inherit}
.in input{flex:1;min-width:0}
.fi{width:100%;background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:0 12px;height:48px}
textarea.fi{height:120px;padding:12px;resize:none;line-height:1.5}
.bt{height:52px;border:0;border-radius:14px;background:var(--ac);color:#1A1200;font-weight:700;font-size:16px;cursor:pointer;width:100%}
.bt:disabled{opacity:.4}.bt.g{background:var(--card);color:var(--tx);border:1px solid var(--bd2)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;font-size:16px;cursor:pointer;display:block;width:100%}
.opt{width:100%;text-align:left;font-size:16px;cursor:pointer}
.opt.ok{border:2px solid var(--ok)}.opt.bad{border:2px solid var(--bad)}
.okc{color:var(--ok)}.badc{color:var(--bad)}.mc{color:var(--ac)}
.lb{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:8px;display:block}
.back{background:none;border:0;color:var(--mu);font-size:14px;text-align:left;padding:0;cursor:pointer}
.t{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:68px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;background:#0F0F0F;border-top:1px solid var(--bd);display:flex}
.t button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.t button.on{color:var(--ac)}
.hc{width:54px;height:54px;border-radius:50%;margin-top:-26px;background:#1E1E1E;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;transition:transform .15s,background-color .2s}
.hb.on .hc{background:var(--ac);color:#1A1200;border-color:var(--ac)}.hb:active .hc{transform:scale(.9)}
.tgl{width:50px;height:30px;border-radius:15px;border:1px solid var(--bd2);background:var(--bd);position:relative;flex:none;cursor:pointer;padding:0}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFF;transition:transform .2s}
.tgl.on{background:var(--ac);border-color:var(--ac)}.tgl.on i{transform:translateX(20px);background:#1A1200}
details.k summary{cursor:pointer;font-weight:600;list-style:none}
details.k p{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--mu)}
.sw{display:flex;gap:10px;font-size:14px;margin-top:8px}.sw i{width:14px;height:14px;border-radius:4px;margin-top:3px;flex:none}
.tag{align-self:flex-start;background:var(--ac);color:#1A1200;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.av{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1A1200;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.go{animation:in .3s cubic-bezier(.2,.7,.2,1)}.go .bar i{animation:grow .7s cubic-bezier(.2,.7,.2,1)}
.noanim *,.noanim *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main><nav class="t" id="tabs" aria-label="Разделы"></nav></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp,$=s=>document.querySelector(s);
const inTg=!!(tg&&tg.initData);
if(inTg){tg.ready();tg.expand();tg.setHeaderColor("#0A0A0A");tg.setBackgroundColor("#0A0A0A");}
const ST={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SRCH=ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>');
const TABS=[["quiz","Тесты",'<path d="M5 12l5 5 9-10"/>'],["cheats","Памятки",'<path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/>'],["home","Главная",'<path d="M3 11l9-8 9 8v10H3z"/>'],["profile","Профиль",'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'],["settings","Настройки",'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>']];
const fresh=()=>({n:0,pts:0,max:0,xp:0,streak:0,last:"",topics:{},hist:[]});
let cfg=Object.assign({haptic:1,anim:1,size:1,remind:0,lang:"all"},ST.g("cfg",{}));
let st=Object.assign(fresh(),ST.g("st",{}));
const hap=()=>{try{tg.HapticFeedback.impactOccurred("light")}catch(e){}};
const day=d=>(d||new Date()).toISOString().slice(0,10);
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

/* Демо-база поиска. В рабочей версии ответ собирает ИИ по вашим документам. */
const KB=[
{k:["v1","принятия решения"],a:"V1 — скорость принятия решения на взлёте. До V1 при отказе взлёт прекращают, после V1 — продолжают.",s:[["РЛЭ самолёта","Раздел 4. Взлёт","RU"],["FCOM","Normal procedures. Takeoff","EN"]]},
{k:["egt","выхлоп"],a:"EGT — температура выхлопных газов. Показывает тепловую нагрузку на двигатель, превышение предела может его повредить.",s:[["РЛЭ самолёта","Силовая установка","RU"]]},
{k:["вариометр","vsi"],a:"Вариометр показывает вертикальную скорость: набор высоты или снижение.",s:[["Памятка","Приборы","RU"]]}];

const TOPICS=["Приборы","Аэродинамика","Метеорология","Навигация","Силовая установка","Процедуры"];
const Q=[
{t:"choice",topic:"Приборы",q:"Что показывает вариометр?",o:["Вертикальную скорость","Приборную скорость","Угол тангажа","Магнитный курс"],ok:0,why:"Вариометр показывает скорость набора высоты или снижения."},
{t:"choice",topic:"Приборы",q:"Что показывает авиагоризонт?",o:["Крен и тангаж","Курс самолёта","Барометрическую высоту","Приборную скорость"],ok:0,why:"Авиагоризонт показывает положение самолёта относительно горизонта: крен и тангаж."},
{t:"choice",topic:"Аэродинамика",q:"От чего зависит подъёмная сила крыла?",o:["От скорости потока, площади крыла и угла атаки","Только от массы самолёта","Только от мощности двигателя","Только от температуры воздуха"],ok:0,why:"Подъёмная сила растёт со скоростью потока, площадью крыла и углом атаки (до критического значения)."},
{t:"choice",topic:"Аэродинамика",q:"Когда происходит срыв потока с крыла?",o:["При превышении критического угла атаки","При остановке двигателя","При выпуске шасси","При наборе высоты"],ok:0,why:"При превышении критического угла атаки подъёмная сила резко падает."},
{t:"choice",topic:"Метеорология",q:"Что покажет высотомер при установке QFE?",o:["Высоту над уровнем аэродрома","Высоту над уровнем моря","Эшелон полёта","Атмосферное давление"],ok:0,why:"При QFE высотомер показывает высоту над уровнем аэродрома, на земле около нуля."},
{t:"choice",topic:"Навигация",q:"Что такое магнитное склонение?",o:["Угол между истинным и магнитным меридианами","Угол между курсом и путевым углом","Угол крена","Разница высоты и эшелона"],ok:0,why:"Магнитное склонение — угол между истинным и магнитным меридианами в данной точке."},
{t:"choice",topic:"Процедуры",q:"Что означает скорость V1?",o:["Скорость принятия решения: до неё взлёт можно прекратить","Скорость подъёма носового колеса","Скорость сваливания","Скорость безопасного набора высоты"],ok:0,why:"До V1 при отказе взлёт прекращают, после V1 продолжают."},
{t:"scn",topic:"Процедуры",s:"Отказ двигателя на разбеге",q:"Что вы будете делать?",d:[["Фаза","Взлёт, разбег"],["Скорость","70 kt"],["V1","90 kt"],["Событие","Отказ двигателя"]],steps:[["Выдерживать направление",["педал","направлен","курс"]],["Убрать газ",["газ","сбрас","убра"]],["Прекратить взлёт",["прекра","прерв","останов","тормоз"]]]},
{t:"par",topic:"Силовая установка",s:"Показатели двигателя",q:"За какие параметры отвечают эти показатели?",i:[["EGT","Температура выхлопных газов",["температур","выхлоп"],[40,14]],["OIL PRESS","Давление масла",["давлен"],[20,18]],["N1","Обороты вентилятора или компрессора низкого давления",["оборот","вращ"],[36,16]]]}];

const INS=[["ASI","Указатель скорости","Приборная скорость, узлы.",1],["AI","Авиагоризонт","Положение самолёта относительно горизонта: крен и тангаж."],["ALT","Высотомер","Высота по давлению; настраивается по давлению аэродрома."],["VSI","Вариометр","Вертикальная скорость: набор или снижение."],["HSI","Курсовой прибор","Курс самолёта и положение относительно выбранного курса."]];
const ARCS=[["#F2F4F7","Белая","скорости с выпущенными закрылками"],["#4ADE80","Зелёная","нормальный рабочий диапазон"],["#FFD23F","Жёлтая","только в спокойном воздухе"],["#FF5C5C","Красная черта","VNE, превышать нельзя"]];

let S={tab:"home",sq:"",mode:"train",kind:"all",tp:[],run:null},lastKey="";
const gauge=(l,p)=>`<svg width="56" height="56" viewBox="0 0 56 56" fill="none" role="img" aria-label="Прибор ${l}"><circle cx="28" cy="28" r="25" stroke="#3D3D3D" stroke-width="2"/><path d="M12 38a18 18 0 0 1 32 0" stroke="#FFF" stroke-width="3" stroke-linecap="round"/><path d="M28 30L${p[0]} ${p[1]}" stroke="#FFB547" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="30" r="3" fill="#FFF"/></svg>`;
const chips=(act,arr,on)=>`<div class="row wrap">${arr.map(a=>`<button class="ch ${on(a[0])?"on":""}" data-act="${act}" data-v="${a[0]}">${a[1]}</button>`).join("")}</div>`;
const tgl=(k,l,sub)=>`<div class="k row sb"><div><b>${l}</b><div class="m">${sub}</div></div><button class="tgl ${cfg[k]?"on":""}" role="switch" aria-checked="${!!cfg[k]}" aria-label="${l}" data-act="tog" data-v="${k}"><i></i></button></div>`;
const pool=()=>Q.filter(q=>(S.kind==="all"||(S.kind==="pick")===(q.t==="choice"))&&(!S.tp.length||S.tp.includes(q.topic)));
const weak=()=>{const e=Object.entries(st.topics).filter(x=>x[1].m).map(x=>[x[0],Math.round(x[1].p/x[1].m*100)]).sort((a,b)=>a[1]-b[1]);return e[0]};
const acc=()=>st.max?Math.round(st.pts/st.max*100):0;

const V={
home:()=>{const w=weak();return `<div class="row sb"><div><div class="m">AeroLearn</div><h1>Готовимся к полётам</h1></div><span class="ch on">${st.streak?st.streak+" дн. подряд":"Начните серию"}</span></div>
<form id="sf" class="in">${SRCH}<input name="q" aria-label="Поиск по базе знаний" placeholder="Спросите по документации..."></form>
<div class="k"><div class="m">Продолжить</div><div style="font-weight:600;font-size:17px;margin:6px 0 10px">Аэродинамика. Лекция 3: Подъёмная сила</div><div class="bar"><i style="width:40%"></i></div><div class="m" style="margin-top:8px">3 из 8 лекций</div></div>
<div class="grid"><button class="k tile" data-go="quiz"><b>Тесты</b><div class="m">Проверка знаний</div></button><button class="k tile" data-go="cheats"><b>Памятки</b><div class="m">Приборы и системы</div></button><button class="k tile" data-go="search"><b>Поиск</b><div class="m">Ответ по документам</div></button><button class="k tile" disabled style="opacity:.5"><b>Лекции</b><div class="m">Скоро</div></button></div>`+
(w?`<button class="k tile" data-act="weak" data-v="${w[0]}"><div class="row sb"><b>Пора повторить: ${w[0]}</b><span class="mc" style="font-weight:700">${w[1]}%</span></div><div class="bar" style="margin-top:10px"><i style="width:${w[1]}%"></i></div></button>`:`<div class="k m">Пройдите первый тест, и здесь появится тема для повторения.</div>`)},
search:()=>{const q=S.sq.toLowerCase().trim(),r=q&&KB.find(x=>x.k.some(w=>q.includes(w))),ss=r?r.s.filter(s=>cfg.lang==="all"||s[2]===cfg.lang):[];
return `<button class="back" data-go="home">← Назад</button><h1>Поиск по базе знаний</h1><form id="sf" class="in">${SRCH}<input name="q" aria-label="Запрос" value="${esc(S.sq)}" placeholder="Например: что такое V1"></form>
<div class="row wrap">${["Что такое V1","Что показывает EGT","Вариометр"].map(x=>`<button class="ch" data-act="q" data-v="${x}">${x}</button>`).join("")}</div>`+
(!q?`<div class="m">Введите вопрос или выберите пример.</div>`:r?`<div class="k" style="border-color:var(--ac);display:flex;flex-direction:column;gap:10px"><span class="tag">ОТВЕТ ИИ (ДЕМО)</span><div style="line-height:1.5">${r.a}</div></div><div class="m" style="font-weight:600">Источники</div>`+(ss.length?ss.map(s=>`<div class="k row sb"><div><b style="font-size:14px">${s[0]}</b><div class="m">${s[1]}</div></div><span class="ch">${s[2]}</span></div>`).join(""):`<div class="k m">Источников на выбранном языке нет (см. Настройки).</div>`)+`<div class="m" style="font-size:12px">Демо-ответ из встроенных примеров. В рабочей версии ответ соберёт ИИ по вашим документам.</div>`:`<div class="k">В демо-базе нет ответа на этот запрос.</div>`)},
quiz:()=>{const r=S.run;
if(!r){const n=Math.min(10,pool().length);return `<h1>Тесты</h1>
<div class="k"><span class="lb">Режим</span>${chips("mode",[["train","Тренировка"],["exam","Экзамен"]],v=>S.mode===v)}<div class="m" style="margin-top:10px">${S.mode==="train"?"Разбор после каждого вопроса":"Без подсказок, результаты и разбор в конце"}</div></div>
<div class="k"><span class="lb">Тип вопросов</span>${chips("kind",[["all","Все"],["pick","С выбором"],["own","Свой ответ"]],v=>S.kind===v)}</div>
<div class="k"><span class="lb">Темы</span>${chips("topic",[["","Все"]].concat(TOPICS.map(t=>[t,t])),v=>v===""?!S.tp.length:S.tp.includes(v))}</div>
<button class="bt" data-act="start" ${n?"":"disabled"}>${n?`Начать (вопросов: ${n})`:"Нет вопросов по выбору"}</button>`;}
const n=r.list.length;
if(r.done)return `<h1>Результат</h1><div class="k" style="text-align:center"><div style="font-size:48px;font-weight:800;color:var(--ac)">${Math.round(r.sc*10)/10} из ${n}</div><div class="m">+${r.xp} XP · ${S.mode==="exam"?"Экзамен":"Тренировка"}</div></div>`+
r.log.map(l=>`<div class="k row sb"><div><b style="font-size:14px">${l.q}</b><div class="m">${l.topic}${l.f<1&&l.c?" · Верно: "+l.c:""}</div></div><b class="${l.f===1?"okc":l.f>0?"mc":"badc"}">${l.f===1?"Верно":l.f>0?"Частично":"Неверно"}</b></div>`).join("")+`<div class="m" style="font-size:12px">Открытые ответы проверяются простым сравнением слов. В рабочей версии это сделает ИИ.</div><button class="bt" data-act="start">Ещё раз</button><button class="bt g" data-act="setup">Изменить параметры</button>`;
const q=r.list[r.i],h=`<div class="row sb"><span class="m">Вопрос ${r.i+1} из ${n}</span><span class="ch">${q.topic}</span></div><div class="bar"><i style="width:${(r.i+1)/n*100}%"></i></div><h1 style="margin-top:6px">${q.q}</h1>`,nx=`<button class="bt" data-act="next">${r.i+1<n?"Дальше":"Показать результат"}</button>`;
if(q.t==="choice")return h+q.o.map((o,i)=>`<button class="k opt ${r.rev?(i===q.ok?"ok":i===r.pick?"bad":""):""}" data-act="opt" data-v="${i}" ${r.rev?"disabled":""}>${o}</button>`).join("")+(r.rev?`<div class="k"><b class="${r.pick===q.ok?"okc":"badc"}">${r.pick===q.ok?"Верно":"Неверно"}</b><div style="margin-top:6px;font-size:14px">${q.why}</div></div>${nx}`:"");
if(q.t==="scn"){const d=`<div class="k" style="padding:4px 14px">${q.d.map(x=>`<div class="row sb" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="m">${x[0]}</span><b style="font-size:14px">${x[1]}</b></div>`).join("")}</div>`;
return h+d+(r.rev?`<div class="k">${r.fb.map(s=>`<div class="${s[1]?"okc":"badc"}" style="padding:4px 0"><b>${s[1]?"Названо":"Пропущено"}:</b> ${s[0]}</div>`).join("")}</div>${nx}`:`<label class="m" for="a1">Ваши действия по порядку</label><textarea id="a1" class="fi" placeholder="Опишите, что вы сделаете..."></textarea><button class="bt" data-act="check">${S.mode==="exam"?"Ответить":"Проверить ответ"}</button>`);}
return h+(r.rev?q.i.map((p,k)=>`<div class="k"><b>${p[0]}</b> <span class="${r.fb[k]?"okc":"badc"}">${r.fb[k]?"верно":"неверно"}</span><div class="m" style="margin-top:4px">Эталон: ${p[1]}</div></div>`).join("")+nx:q.i.map((p,k)=>`<div class="k" style="display:flex;flex-direction:column;gap:10px"><div class="row">${gauge(p[0],p[3])}<b style="font-size:18px">${p[0]}</b></div><input class="fi" id="p${k}" aria-label="За что отвечает ${p[0]}" placeholder="Впишите ответ"></div>`).join("")+`<button class="bt" data-act="check">${S.mode==="exam"?"Ответить":"Проверить ответ"}</button>`);},
cheats:()=>`<h1>Памятки: приборы</h1>`+INS.map(i=>`<details class="k"><summary>${i[1]} <span class="m">(${i[0]})</span></summary><p>${i[2]}</p>${i[3]?ARCS.map(a=>`<div class="sw"><i style="background:${a[0]}"></i><span><b style="color:#FFF">${a[1]}</b> — ${a[2]}</span></div>`).join(""):""}</details>`).join(""),
profile:()=>{const u=inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,nm=u&&u.first_name?u.first_name:"Пилот",lv=Math.floor(st.xp/100)+1,tp=Object.entries(st.topics).filter(x=>x[1].m);
return `<h1>Профиль</h1><div class="k"><div class="row"><div class="av">${esc(nm[0].toUpperCase())}</div><div style="flex:1"><b style="font-size:18px">${esc(nm)}</b><div class="m">Уровень ${lv} · ${st.xp%100} из 100 XP</div><div class="bar" style="margin-top:8px"><i style="width:${st.xp%100}%"></i></div></div></div></div>
<div class="grid"><div class="k"><div class="m">Тестов пройдено</div><b style="font-size:26px">${st.n}</b></div><div class="k"><div class="m">Точность</div><b style="font-size:26px">${acc()}%</b></div><div class="k"><div class="m">Серия, дней</div><b style="font-size:26px">${st.streak}</b></div><div class="k"><div class="m">Всего XP</div><b style="font-size:26px">${st.xp}</b></div></div>
<div class="k"><span class="lb">По темам</span>${tp.length?tp.map(x=>{const p=Math.round(x[1].p/x[1].m*100);return `<div style="margin-bottom:12px"><div class="row sb"><span style="font-size:14px">${x[0]}</span><b class="mc">${p}%</b></div><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`}).join(""):`<div class="m">Пока нет данных. Пройдите тест.</div>`}</div>
<div class="k"><span class="lb">Последние тесты</span>${st.hist.length?st.hist.map(h=>`<div class="row sb" style="padding:6px 0"><span class="m">${h.d} · ${h.mode==="exam"?"Экзамен":"Тренировка"}</span><b>${Math.round(h.p*10)/10} из ${h.m}</b></div>`).join(""):`<div class="m">Пока пусто.</div>`}</div>
<div class="m" style="font-size:12px">Статистика хранится на этом устройстве. Общий прогресс между устройствами появится вместе с сервером.</div>`},
settings:()=>`<h1>Настройки</h1>${tgl("haptic","Вибрация","Отклик при нажатиях")}${tgl("anim","Анимации","Плавные переходы между экранами")}${tgl("remind","Напоминания","Заработает после подключения сервера")}
<div class="k"><span class="lb">Размер текста</span>${chips("size",[[0,"Мелкий"],[1,"Обычный"],[2,"Крупный"]],v=>cfg.size==v)}</div>
<div class="k"><span class="lb">Язык источников в поиске</span>${chips("lang",[["all","Все"],["RU","RU"],["EN","EN"]],v=>cfg.lang===v)}</div>
<button class="bt g" data-act="reset" style="color:var(--bad)">Сбросить статистику</button>
<div class="m" style="font-size:12px;line-height:1.5">AeroLearn — учебное приложение. Оно не заменяет официальные документы, РЛЭ конкретного самолёта и инструктора.</div>`};

function apply(){document.body.classList.toggle("noanim",!cfg.anim);$("#view").style.zoom=[.9,1,1.12][cfg.size];}
function render(){const v=$("#view"),r=S.run,key=S.tab+(r?(r.done?"d":"r"+r.i+(r.rev?"v":"")):"");
v.innerHTML=V[S.tab]();if(key!==lastKey){v.classList.remove("go");void v.offsetWidth;v.classList.add("go");window.scrollTo(0,0);lastKey=key;}
$("#tabs").innerHTML=TABS.map(t=>t[0]==="home"?`<button class="hb ${S.tab==="home"||S.tab==="search"?"on":""}" data-go="home"><span class="hc">${ic(t[2])}</span>${t[1]}</button>`:`<button class="${t[0]===S.tab?"on":""}" data-go="${t[0]}">${ic(t[2])}${t[1]}</button>`).join("");
if(inTg){S.tab==="search"?tg.BackButton.show():tg.BackButton.hide();}apply();}
function start(){const l=sh(pool()).slice(0,10).map(q=>{if(q.t!=="choice")return q;const o=sh(q.o.map((t,i)=>[t,i]));return Object.assign({},q,{o:o.map(x=>x[0]),ok:o.findIndex(x=>x[1]===q.ok)})});S.run={list:l,i:0,rev:0,log:[],sc:0,done:0};}
function fin(f){const r=S.run,q=r.list[r.i];r.log.push({q:q.s||q.q,topic:q.topic,f:f,c:q.t==="choice"?q.o[q.ok]:""});r.sc+=f;if(S.mode==="exam")advance();else r.rev=1;}
function advance(){const r=S.run;if(r.i+1<r.list.length){r.i++;r.rev=0;return;}
const n=r.list.length;r.done=1;r.xp=Math.round(r.sc*10);st.n++;st.pts+=r.sc;st.max+=n;st.xp+=r.xp;
r.log.forEach(l=>{const t=st.topics[l.topic]||(st.topics[l.topic]={p:0,m:0});t.p+=l.f;t.m++;});
const td=day(),yd=day(new Date(Date.now()-864e5));if(st.last!==td){st.streak=st.last===yd?st.streak+1:1;st.last=td;}
st.hist.unshift({d:td,p:r.sc,m:n,mode:S.mode});st.hist=st.hist.slice(0,5);ST.s("st",st);}
function check(){const r=S.run,q=r.list[r.i],has=(s,k)=>k.some(x=>s.includes(x));let f;
if(q.t==="scn"){const v=$("#a1").value.toLowerCase();r.fb=q.steps.map(s=>[s[0],has(v,s[1])]);f=r.fb.filter(x=>x[1]).length/q.steps.length;}
else{r.fb=q.i.map((p,k)=>has($("#p"+k).value.toLowerCase(),p[2]));f=r.fb.filter(Boolean).length/q.i.length;}fin(f);}

document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-act]");if(!t||t.disabled)return;if(cfg.haptic)hap();const d=t.dataset,a=d.act,v=d.v;
if(a==="tog"){cfg[v]=cfg[v]?0:1;ST.s("cfg",cfg);t.classList.toggle("on");t.setAttribute("aria-checked",!!cfg[v]);apply();return;}
if(a==="reset"){const ok=()=>{st=fresh();ST.s("st",st);render()},m="Сбросить всю статистику?";(inTg&&tg.showConfirm)?tg.showConfirm(m,y=>y&&ok()):(confirm(m)&&ok());return;}
if(d.go){S.tab=d.go;}
else if(a==="q")S.sq=v;
else if(a==="mode")S.mode=v;else if(a==="kind")S.kind=v;
else if(a==="topic")S.tp=v===""?[]:S.tp.includes(v)?S.tp.filter(x=>x!==v):S.tp.concat(v);
else if(a==="start")start();
else if(a==="setup")S.run=null;
else if(a==="weak"){S.tp=[v];S.run=null;S.tab="quiz";}
else if(a==="opt"){S.run.pick=+v;fin(S.run.pick===S.run.list[S.run.i].ok?1:0);}
else if(a==="check")check();else if(a==="next")advance();
else if(a==="size"){cfg.size=+v;ST.s("cfg",cfg);}
else if(a==="lang"){cfg.lang=v;ST.s("cfg",cfg);}
render();});
document.addEventListener("submit",e=>{if(e.target.id==="sf"){e.preventDefault();S.sq=e.target.q.value;S.tab="search";render();}});
if(inTg)tg.BackButton.onClick(()=>{S.tab="home";render();});
render();
</script>
</body>
</html>
